# Every change that reaches the main branch is tested, built and published
# as a release, for Windows, Linux and macOS. Installed copies of Screen
# Portals look at the newest release and update themselves (see
# src/update.rs), so pushing to main is all it takes to update every
# computer.
#
# Pull requests are only tested; nothing is published from them.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # needed to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The build number is this workflow's run number: it only ever goes up,
# which is how an installed copy knows a release is newer. (Renaming this
# workflow file would start the count again from 1, and installed copies
# would then ignore the lower numbers.) Builds for pull requests carry no
# number, exactly like builds made by hand, and never update themselves.
# The number is given to the Build steps only: the tests check how a build
# without one behaves.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --locked

      - name: Build
        env:
          SCREEN_PORTALS_BUILD: ${{ github.event_name == 'push' && github.run_number || '' }}
          SCREEN_PORTALS_REPO: ${{ github.repository }}
        run: cargo build --release --locked

      # latest.json tells installed copies what the newest build is and
      # what the program file must hash to once downloaded.
      - name: Describe the build
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/ScreenPortals.exe, target/release/screen-portals.exe out/
          $program = Get-Item out/ScreenPortals.exe
          $hash = (Get-FileHash $program -Algorithm SHA256).Hash.ToLower()
          $json = '{"build":${{ github.run_number }},"sha256":"' + $hash + '","size":' + $program.Length + '}'
          [IO.File]::WriteAllText("$PWD/out/latest.json", $json)
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  linux:
    # The oldest Ubuntu on offer, so the programs also start on Linux
    # systems that are a few years old.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what the desktop test needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool xclip xinput pulseaudio pulseaudio-utils

      - name: Test
        run: cargo test --locked

      - name: Build
        env:
          SCREEN_PORTALS_BUILD: ${{ github.event_name == 'push' && github.run_number || '' }}
          SCREEN_PORTALS_REPO: ${{ github.repository }}
        run: cargo build --release --locked

      # Two pretend desktops, one copy of the program on each: pair them,
      # push the mouse across, type, copy and come back.
      - name: Test on pretend desktops
        run: bash tests/linux-desktop.sh target/release

      - name: Describe the build
        run: |
          mkdir out
          cp target/release/ScreenPortals out/ScreenPortals-linux-x86_64
          cp target/release/screen-portals out/screen-portals-linux-x86_64
          hash=$(sha256sum out/ScreenPortals-linux-x86_64 | cut -d' ' -f1)
          size=$(stat -c %s out/ScreenPortals-linux-x86_64)
          printf '{"build":%s,"sha256":"%s","size":%s}' "${{ github.run_number }}" "$hash" "$size" > out/latest-linux-x86_64.json
          cat out/latest-linux-x86_64.json

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --locked

      # One program for both kinds of Mac: built for Apple Silicon and for
      # Intel, then joined into one file.
      - name: Build
        env:
          SCREEN_PORTALS_BUILD: ${{ github.event_name == 'push' && github.run_number || '' }}
          SCREEN_PORTALS_REPO: ${{ github.repository }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --example pretend_peer

      # ScreenPortals.app is what people download. Installed copies update
      # by replacing only the program inside it, so that program is also
      # published on its own (ScreenPortals-macos). The signature is the
      # free "ad hoc" kind: enough for a Mac to run it, but macOS still
      # treats it as coming from an unidentified developer.
      - name: Package
        run: |
          mkdir -p out dist/ScreenPortals.app/Contents/MacOS
          for name in ScreenPortals screen-portals; do
            lipo -create "target/aarch64-apple-darwin/release/$name" "target/x86_64-apple-darwin/release/$name" -output "dist/$name"
          done
          cp packaging/macos/Info.plist dist/ScreenPortals.app/Contents/
          mv dist/ScreenPortals dist/ScreenPortals.app/Contents/MacOS/ScreenPortals
          codesign --force --sign - --identifier io.github.screenportals dist/ScreenPortals.app
          codesign --force --sign - --identifier io.github.screenportals.cli dist/screen-portals
          codesign --verify --strict --verbose dist/ScreenPortals.app
          lipo -archs dist/ScreenPortals.app/Contents/MacOS/ScreenPortals
          cp dist/ScreenPortals.app/Contents/MacOS/ScreenPortals out/ScreenPortals-macos
          cp dist/screen-portals out/screen-portals-macos
          (cd dist && ditto -c -k --keepParent ScreenPortals.app ../out/ScreenPortals-macos.zip)
          hash=$(shasum -a 256 out/ScreenPortals-macos | cut -d' ' -f1)
          size=$(stat -f %z out/ScreenPortals-macos)
          printf '{"build":%s,"sha256":"%s","size":%s}' "${{ github.run_number }}" "$hash" "$size" > out/latest-macos.json
          cat out/latest-macos.json

      # The real Mac programs, as published, paired with a pretend
      # computer: push the mouse across, type, copy and come back.
      - name: Test on this Mac
        run: |
          mkdir -p shipped/examples
          cp dist/screen-portals shipped/
          cp target/release/examples/pretend_peer shipped/examples/
          bash tests/macos-desktop.sh shipped dist/ScreenPortals.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/
          if-no-files-found: error

  # One release holding every system's files. Windows and Linux must have
  # built; if the Mac did not, the release goes out without Mac files and
  # Macs simply keep the version they have.
  release:
    if: github.event_name == 'push' && !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Mac did not build this time: keep offering the last Mac files,
          # so the Mac download never disappears. Macs see their own build
          # number in them and stay as they are.
          [ -e out/latest-macos.json ] || gh release download --pattern '*macos*' --dir out || true
          gh release create "build-${{ github.run_number }}" out/* \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Installed copies update to this by themselves." \
            --target "${{ github.sha }}" \
            --latest
